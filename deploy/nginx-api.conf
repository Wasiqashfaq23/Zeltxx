# api.yourdomain.com - reverse proxy to the backend (Express + Socket.IO on :5001)
# Reference config: replace the server_name, copy to /etc/nginx/sites-available/zeltxx-api,
# symlink into sites-enabled, `nginx -t`, then: certbot --nginx -d api.yourdomain.com
# Nginx sits in front of the app, so the backend must run with TRUST_PROXY=true
# (its rate limiter and req.ip then read X-Forwarded-For set here).

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    # GitHub webhook payloads + attachment metadata can exceed Nginx's 1m default.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Socket.IO needs a proper WS upgrade, not a plain HTTP proxy. The SPA opens it
    # against this origin (VITE_API_URL) at the default /socket.io path.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}