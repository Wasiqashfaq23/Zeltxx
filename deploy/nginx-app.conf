# app.yourdomain.com - serves the built SPA from /var/www/zeltxx/frontend
# Reference config: replace the server_name, copy to /etc/nginx/sites-available/zeltxx-app,
# symlink into sites-enabled, `nginx -t`, then: certbot --nginx -d app.yourdomain.com

server {
    listen 80;
    listen [::]:80;
    server_name app.yourdomain.com;

    root /var/www/zeltxx/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived immutable hashed assets emitted by the Vite build.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* \.(?:js|css|map|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}