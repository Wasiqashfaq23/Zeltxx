name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - syntax + audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Syntax check (node --check)
        run: node scripts/check-syntax.js

      - name: Audit production deps
        run: pnpm audit --prod

  frontend:
    name: Frontend - lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    # Build sanity only; a real API origin is baked in by the deploy job instead.
    env:
      VITE_API_URL: https://ci-placeholder.invalid
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  # VPS deployment: kept for the future (see deploy/SERVER_SETUP.md). Runs ONLY
  # when triggered manually via Actions -> "Run workflow", so pushes to main stay
  # green using Vercel (frontend) + Render (backend) auto-deploys instead.
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Frontend/pnpm-lock.yaml

      - name: Build frontend with production API URL
        working-directory: Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: mkdir -p ~/.ssh && ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync frontend build
        run: rsync -az --delete Frontend/dist/ "$SSH_USER@$SSH_HOST:/var/www/zeltxx/frontend/"

      - name: Sync backend source
        run: >
          rsync -az --delete
          --exclude node_modules --exclude .env --exclude uploads
          Backend/ "$SSH_USER@$SSH_HOST:/var/www/zeltxx/backend/"

      - name: Install production deps and reload process
        run: >
          ssh "$SSH_USER@$SSH_HOST"
          'cd /var/www/zeltxx/backend && pnpm install --prod --frozen-lockfile
          && (pm2 describe zeltxx-backend >/dev/null 2>&1 && pm2 restart zeltxx-backend
          || pm2 start index.js --name zeltxx-backend) && pm2 save'

      - name: Post-deploy health check
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /tmp/zeltxx-health.json -w '%{http_code}' "$VITE_API_URL/health" 2>/dev/null || true)
            status=$(grep -o '"status":"ok"' /tmp/zeltxx-health.json 2>/dev/null || true)
            if [ "$code" = "200" ] && [ -n "$status" ]; then
              echo "Health check passed: $VITE_API_URL/health returned $code"
              exit 0
            fi
            echo "Health check attempt $i: HTTP $code, waiting..."; sleep 5
          done
          echo "Deploy failed: health check did not return 200/ok within 60s (last HTTP: ${code:-none})"
          exit 1